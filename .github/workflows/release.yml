name: Release Manifest Parser Go module new version

on:
  workflow_dispatch:
    inputs:
      version:
        required: false
        default: ''
        description: Optional version to release. If not provided, the next patch version will be used.
      prerelease:
        description: Mark this release as a prerelease
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  tag-and-release:
    name: Tag and Release
    permissions:
      contents: write  # for git push tag
    runs-on: cx-public-ubuntu-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # need full history for tags
          persist-credentials: false

      - name: Determine new version
        id: newver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          raw="${INPUT_VERSION}"

          if [ -n "$raw" ]; then
            # Ensure 'v' prefix
            if [[ "$raw" == v* ]]; then
              normalized="$raw"
            else
              normalized="v$raw"
            fi
            echo "Using provided version: $normalized"
            echo "new_version=$normalized" >> $GITHUB_ENV
            exit 0
          fi

          # No input: bump patch of latest tag
          git fetch --tags
          latest=$(git describe --tags --abbrev=0)
          bare=${latest#v}

          IFS=. read major minor patch <<< "$bare"
          patch=$((patch + 1))
          new="v${major}.${minor}.${patch}"

          echo "Latest tag is ${latest}, bumping patch to ${new}"
          echo "new_version=${new}" >> $GITHUB_ENV

      - name: Create and push Git tag
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          NEW_VERSION: ${{ env.new_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "${ACTOR}"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          git remote set-url origin https://${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git tag "${NEW_VERSION}" -m "Release ${NEW_VERSION}"
          git push origin "${NEW_VERSION}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ env.new_version }}
          IS_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          prerelease_flag=""
          if [ "${IS_PRERELEASE}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${NEW_VERSION}" \
            --title "Release ${NEW_VERSION}" \
            $prerelease_flag
